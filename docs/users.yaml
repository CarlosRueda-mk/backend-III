paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Returns all registered users.
      responses:
        "200":
          $ref: "#/components/responses/UsersListResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    post:
      tags:
        - Users
      summary: Create a new user
      description: Creates a new user in the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Carlos Rueda
                email:
                  type: string
                  format: email
                  example: carlos@example.com
                password:
                  type: string
                  format: password
                  example: P@ssw0rd123
                role:
                  type: string
                  example: user
      responses:
        "201":
          $ref: "#/components/responses/UserCreatedResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"

/api/users/{id}:
  get:
    tags:
      - Users
    summary: Get user by ID
    description: Returns a user by its ID.
    parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: string
        example: 6a94e4245b5292408d7afff3
    responses:
      "200":
        description: User found successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      "404":
        $ref: "#/components/responses/NotFoundResponse"
      "500":
        $ref: "#/components/responses/InternalServerErrorResponse"

  put:
    tags:
      - Users
    summary: Update a user
    description: Updates an existing user by its ID.
    parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: string
        example: 6a94e4245b5292408d7afff3
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: Carlos Rueda
              email:
                type: string
                format: email
                example: carlos.updated@example.com
              password:
                type: string
                format: password
                example: NewPassword123
              role:
                type: string
                example: user
    responses:
      "200":
        description: User updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      "404":
        $ref: "#/components/responses/NotFoundResponse"
      "409":
        $ref: "#/components/responses/ConflictResponse"
      "500":
        $ref: "#/components/responses/InternalServerErrorResponse"
  delete:
    tags:
      - Users
    summary: Delete a user
    description: Deletes an existing user by its ID.
    parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: string
        example: 6a94e4245b5292408d7afff3
    responses:
      "200":
        description: User deleted successfully
        content:
          application/json:
            schema:
              type: string
              example: User deleted
      "404":
        $ref: "#/components/responses/NotFoundResponse"
      "500":
        $ref: "#/components/responses/InternalServerErrorResponse"
/api/users/{id}/documents:
  post:
    tags:
      - Users
    summary: Upload a user document
    description: Uploads a document and associates it with an existing user.
    parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: string
        example: 6a94e4245b5292408d7afff3
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - document
              - documentType
            properties:
              document:
                type: string
                format: binary
                description: Document file to upload.
              documentType:
                type: string
                description: Type of document.
                enum:
                  - driver_license
                example: driver_license
    responses:
      "200":
        description: Document uploaded successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      "400":
        $ref: "#/components/responses/ValidationErrorResponse"
      "404":
        $ref: "#/components/responses/NotFoundResponse"
      "500":
        $ref: "#/components/responses/InternalServerErrorResponse"
/api/orders/{id}/receipt:
  post:
    tags:
      - Orders
    summary: Upload an order receipt
    description: Uploads a receipt and associates it with an existing order.
    parameters:
      - name: id
        in: path
        required: true
        description: Order ID
        schema:
          type: string
        example: 6a9637881b6dcd44829f5b3a

    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - receipt
            properties:
              receipt:
                type: string
                format: binary
                description: Receipt file to upload.

    responses:
      "200":
        description: Receipt uploaded successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"

      "400":
        $ref: "#/components/responses/ValidationErrorResponse"

      "404":
        $ref: "#/components/responses/NotFoundResponse"

      "500":
        $ref: "#/components/responses/InternalServerErrorResponse"
