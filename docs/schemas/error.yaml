components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code
              example: USER_NOT_FOUND
            message:
              type: string
              description: Description of the error
              example: User not found
            cause:
              type: string
              nullable: true
              description: Additional information about the error
              example: The requested user does not exist
