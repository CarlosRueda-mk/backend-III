components:
  responses:
    HealthResponse:
      description: Response for health check endpoint
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    BadRequestResponse:
      description: Bad request response
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid request data

    UsersListResponse:
      description: List of users
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/User"

    UserCreatedResponse:
      description: User created successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"

    NotFoundResponse:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: NOT_FOUND
              message: User not found

    ConflictResponse:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: DUPLICATE_RESOURCE
              message: This email is already used

    InvalidQuantityResponse:
      description: Invalid quantity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Quantity must be between 1 and 100

    InternalServerErrorResponse:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: Internal server error

    ProductsListResponse:
      description: List of products
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Product"

    ProductCreatedResponse:
      description: Product created successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Product"

    OrdersListResponse:
      description: List of orders
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Order"

    OrderCreatedResponse:
      description: Order created successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Order"

    DeliveriesListResponse:
      description: List of deliveries
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Delivery"

    DeliveryCreatedResponse:
      description: Delivery created successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Delivery"

    MockUsersResponse:
      description: List of generated mock users
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/User"

    MockOrdersResponse:
      description: List of generated mock orders
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Order"

    MockProductsResponse:
      description: List of generated mock products
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Product"

    MockDeliveriesResponse:
      description: List of generated mock deliveries
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Delivery"

    MockPopulateResponse:
      description: Mock data inserted successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Mock data inserted successfully
              data:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Delivery"
