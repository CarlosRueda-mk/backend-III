paths:
  /api/deliveries:
    get:
      tags:
        - Deliveries
      summary: Get all deliveries
      description: Returns all registered deliveries.
      responses:
        "200":
          $ref: "#/components/responses/DeliveriesListResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    post:
      tags:
        - Deliveries
      summary: Create a new delivery
      description: Creates a new delivery in the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order
                - deliveryMan
              properties:
                order:
                  type: string
                  description: ID of the order associated with the delivery
                  example: 64f1a2b3c4d5e6f789012345
                deliveryMan:
                  type: string
                  description: ID of the user assigned as delivery man
                  example: 64f1a2b3c4d5e6f789012346
                priority:
                  type: string
                  example: medium
                status:
                  type: string
                  example: pending
      responses:
        "201":
          $ref: "#/components/responses/DeliveryCreatedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/deliveries/{id}:
    get:
      tags:
        - Deliveries
      summary: Get delivery by ID
      description: Returns a delivery by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Delivery ID
          schema:
            type: string
          example: 6a6d25299ea235bc815a4b78
      responses:
        "200":
          description: Delivery found successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    put:
      tags:
        - Deliveries
      summary: Update a delivery
      description: Updates an existing delivery by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Delivery ID
          schema:
            type: string
          example: 6a6d25299ea235bc815a4b78
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: string
                  description: ID of the order associated with the delivery
                  example: 6a6d25299ea235bc815a4b68
                deliveryMan:
                  type: string
                  description: ID of the user assigned as delivery man
                  example: 6a6d25299ea235bc815a4b68
                priority:
                  type: string
                  example: medium
                status:
                  type: string
                  example: pending
      responses:
        "200":
          description: Delivery updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    delete:
      tags:
        - Deliveries
      summary: Delete a delivery
      description: Deletes an existing delivery by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Delivery ID
          schema:
            type: string
          example: 6a6d25299ea235bc815a4b78
      responses:
        "200":
          description: Delivery deleted successfully
          content:
            application/json:
              schema:
                type: string
                example: Delivery deleted
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
